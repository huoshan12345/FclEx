name: Build
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - '*.sln'
      - '*.slnx'
      - build/pack.ps1
      - build/pkg.version
      - NuGet.Config
      - src/**
      - test/**
  pull_request_target: # use pull_request_target instead of pull_request to let dependabot have permission to access action secrets.
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write

env:
  SOLUTION: FclEx.slnx
  DOTNET_NOLOGO: 1
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  MYGET_SOURCE: https://www.myget.org/F/huoshan12345/api/v2/package
  USE_NUGET: true
  USE_MYGET: false
  ARTIFACTS_NAME: nuget-packages
  ARTIFACTS_DIR: ./artifacts/nuget/

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Get PR
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: suzuki-shunsuke/get-pr-action@v0.1.0
        id: pr

      - name: Print commit sha
        shell: pwsh
        run: |
          echo "merge_commit_sha: ${{ steps.pr.outputs.merge_commit_sha }}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.merge_commit_sha }}

      - name: Set version
        id: set_version
        shell: pwsh
        run: |
          $ver = Get-Content -Path ./build/pkg.version
          echo "version=$ver" >> $Env:GITHUB_OUTPUT
          echo $ver

  build-win:
    runs-on: windows-latest
    env:
      TMP: D:\tmp
      TEMP: D:\tmp
      DOTNET_INSTALL_DIR: D:\tools\dotnet
      NUGET_PACKAGES: D:\.nuget\packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - build
      - build-win
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set version
        shell: pwsh
        run: |
          "VERSION=${{ needs.build.outputs.version }}" >> $Env:GITHUB_ENV
          echo ${{ env.VERSION }}

      - name: Create Tag
        uses: huoshan12345/update-tag@v1
        with:
          tag_name: ${{ env.VERSION }}
          update_if_exists: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          token: ${{ secrets.PAT }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
...
