# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  DOTNET_NOLOGO: 1
  MYGET_APIKEY: ${{ secrets.MYGET_APIKEY }}

jobs:
  build-windows:
    runs-on: windows-latest
    
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: 111111
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7
        ports:
          - 6379:6379
        entrypoint: redis-server --requirepass a.o7a@bj
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        
      rabbitmq:
        image: heidiks/rabbitmq-delayed-message-exchange:latest
        env:
          RABBITMQ_DEFAULT_USER: rmq
          RABBITMQ_DEFAULT_PASS: lijing
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmqctl node_health_check"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
          
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x

      - name: Test Debug
        run: |
          ./build/test_all.ps1 Debug prod

      - name: Test Release
        run: |
          ./build/test_all.ps1 Release prod

      - name: NuGet Publish
        if: ${{ github.ref == 'refs/heads/master' }}
        shell: pwsh
        run: |
          ./build/pack.ps1

      - name: Set variables
        run: |
          $ver = Get-Content -Path ./build/pkg.version
          echo "VERSION=$ver" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
          echo $ver

      - name: Create Tag
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: richardsimko/update-tag@v1
        with:
          tag_name: ${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
