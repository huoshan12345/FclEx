name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write
  statuses: write
  checks: write
  actions: write
  id-token: write

env:
  SOLUTION: FclEx.slnx
  DOTNET_NOLOGO: 1
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  MYGET_SOURCE: https://www.myget.org/F/huoshan12345/api/v2/package
  USE_NUGET: true
  USE_MYGET: false
  ARTIFACTS_NAME: nuget-packages
  ARTIFACTS_DIR: ./artifacts/nuget/

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.filter.outputs.build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - '*.rsp'
              - '*.sln'
              - '*.slnx'
              - .github/workflows/build.yml
              - build/**
              - Directory.Packages.props
              - global.json
              - NuGet.Config
              - src/**
              - test/**

  build:
    name: build-ubuntu-${{ matrix.framework }}
    runs-on: ubuntu-latest
    if: needs.changes.outputs.should-build == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: 8.0.x
          - framework: net9.0
            sdk: 9.0.x
          - framework: net10.0
            sdk: 10.0.x
          - framework: net11.0
            sdk: 11.0.x

    needs:
      - changes

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup sops
        uses: nhedger/setup-sops@v3

      - name: Setup age
        uses: alessiodionisi/setup-age-action@v1.4.0

      - name: Decrypt appsettings
        shell: pwsh
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ./build/decrypt.ps1

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            ${{ matrix.sdk }}
            11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.framework }}-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.framework }}-v1-
            nuget-${{ runner.os }}-v1-

      - name: Test Release
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet test --solution ${{ env.SOLUTION }} -c Release -f ${{ matrix.framework }} `
          --max-parallel-test-modules 4 --no-artifact-post-processing

      - name: Test Report
        uses: dorny/test-reporter@main
        if: (success() || failure())
        with:
          name: Test Report (Ubuntu ${{ matrix.framework }})
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed

  build-win:
    name: build-win-${{ matrix.framework }}
    runs-on: windows-latest
    if: needs.changes.outputs.should-build == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net8.0
            sdk: 8.0.x
          - framework: net9.0
            sdk: 9.0.x
          - framework: net10.0
            sdk: 10.0.x
          - framework: net11.0
            sdk: 11.0.x
          - framework: net472
            sdk: ''

    needs:
      - changes

    env:
      TMP: D:\tmp
      TEMP: D:\tmp
      DOTNET_INSTALL_DIR: D:\tools\dotnet
      NUGET_PACKAGES: D:\.nuget\packages

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup sops
        shell: pwsh
        run: |
          choco install sops -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sops --version

      - name: Setup age
        shell: pwsh
        run: |
          choco install age.portable -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          age --version

      - name: Decrypt appsettings
        shell: pwsh
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          ./build/decrypt.ps1

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            ${{ matrix.sdk }}
            11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-pack-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-pack-v1-
            nuget-${{ runner.os }}-v1-

      - name: Test Release
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet test --solution ${{ env.SOLUTION }} -c Release -f ${{ matrix.framework }} `
          --max-parallel-test-modules 4 --no-artifact-post-processing

      - name: Test Report
        uses: dorny/test-reporter@main
        if: (success() || failure())
        with:
          name: Test Report (Windows)
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          list-suites: failed
          list-tests: failed

  pack:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.should-build == 'true'

    needs:
      - changes

    outputs:
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create package solution
        shell: pwsh
        run: ./build/create-ci-solution.ps1 -Kind Packages -OutputPath ${{ env.SOLUTION }}

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-pack-v1-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'NuGet.Config', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-pack-v1-
            nuget-${{ runner.os }}-v1-

      - name: Set version
        id: set_version
        shell: pwsh
        run: |
          $ver = Get-Content -Path ./build/pkg.version
          echo "version=$ver" >> $Env:GITHUB_OUTPUT
          echo $ver

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack ${{ env.SOLUTION }} -v q -c Release `
          --include-symbols -p:SymbolPackageFormat=snupkg -p:PackageVersion=${{ steps.set_version.outputs.version }} `
          -o ${{ env.ARTIFACTS_DIR }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACTS_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

  build-result:
    if: always()
    runs-on: ubuntu-latest

    needs:
      - changes
      - build
      - build-win
      - pack

    steps:
      - name: Check result
        shell: pwsh
        run: |
          $shouldBuild = "${{ needs.changes.outputs.should-build }}" -eq "true"

          $jobs = @(
            @{
              Name = "build"
              Result = "${{ needs.build.result }}"
              AllowSkipped = -not $shouldBuild
            },
            @{
              Name = "build-win"
              Result = "${{ needs.build-win.result }}"
              AllowSkipped = -not $shouldBuild
            },
            @{
              Name = "pack"
              Result = "${{ needs.pack.result }}"
              AllowSkipped = -not $shouldBuild
            },
            @{
              Name = "changes"
              Result = "${{ needs.changes.result }}"
              AllowSkipped = $false
            }
          )

          $invalidJobs = @()

          foreach ($job in $jobs) {
            Write-Host "$($job.Name): $($job.Result)"

            $isValid =
              $job.Result -eq "success" -or
              ($job.Result -eq "skipped" -and $job.AllowSkipped)

            if (-not $isValid) {
              $invalidJobs += $job
            }
          }

          if ($invalidJobs.Count -gt 0) {
            Write-Host "Invalid job results:"

            foreach ($job in $invalidJobs) {
              Write-Host "- $($job.Name): $($job.Result)"
            }

            exit 1
          }

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    needs:
      - build-result
      - pack

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACTS_NAME }}
          path: ${{ env.ARTIFACTS_DIR }}

      - name: List packages
        shell: bash
        run: |
          echo "Downloaded files:"
          ls -lhR ${{ env.ARTIFACTS_DIR }}

      - name: NuGet Login
        if: env.USE_NUGET == 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: huoshan12345

      - name: NuGet Publish
        if: env.USE_NUGET == 'true'
        shell: pwsh
        run: |
          dotnet nuget push "${{ env.ARTIFACTS_DIR }}*.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "${{ env.NUGET_SOURCE }}" `
            --skip-duplicate

      - name: MyGet Publish
        if: env.USE_MYGET == 'true'
        shell: pwsh
        run: |
          dotnet nuget push "${{ env.ARTIFACTS_DIR }}*.nupkg" `
            --api-key "${{ secrets.MYGET_APIKEY }}" `
            --source "${{ env.MYGET_SOURCE }}" `
            --skip-duplicate

      - name: Set version
        shell: pwsh
        run: |
          $ver = "${{ needs.pack.outputs.version }}"
          echo "VERSION=$ver" >> $Env:GITHUB_ENV
          echo $ver

      - name: Create Tag
        uses: huoshan12345/update-tag@v1
        with:
          tag_name: ${{ env.VERSION }}
          update_if_exists: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.VERSION }}
          token: ${{ secrets.PAT }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
...
