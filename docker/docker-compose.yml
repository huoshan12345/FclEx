version: '3.8'

services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 111111
    ports:
      - 5432:5432
    volumes: 
      - postgres:/var/lib/postgresql/data
      
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 111111
    ports:
      - 3306:3306
    volumes:
      - mysql:/var/lib/mysql
      
  redis:
    image: redis:7
    restart: always
    ports:
      - 6379:6379
    command: redis-server --requirepass 111111
    volumes: 
      - redis:/data
      
  rabbitmq:
    build:
      context: ./rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: rmq
      RABBITMQ_DEFAULT_PASS: 111111
    ports:
      - 5672:5672
    volumes: 
      - rabbitmq:/var/lib/rabbitmq
      
      
volumes:
  postgres:
  mysql:
  redis:
  rabbitmq:
